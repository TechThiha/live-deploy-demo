<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deployed from thiha.cloud</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'nonce-CSP_NONCE_PLACEHOLDER'; style-src 'self' 'nonce-CSP_NONCE_PLACEHOLDER'; img-src 'self' data:; connect-src 'self'; frame-ancestors https://dev.thiha.cloud; base-uri 'none'; form-action 'none'">
  <style nonce="CSP_NONCE_PLACEHOLDER">
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Noto Sans Myanmar', 'Myanmar Sangam MN', 'Myanmar MN', 'Padauk', monospace; background: #0b0d0f; color: #e6e8ea; }
    .card { width: 100%; max-width: 560px; border: 1px solid rgba(148,163,184,0.16); border-radius: 16px; background: #131619; overflow: hidden; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,0.16); background: rgba(0,0,0,0.2); }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .dot--close { background: #ec6a5e; }
    .dot--min { background: #f4bf4f; }
    .dot--max { background: #61c554; }
    .bar span { margin-left: auto; font-size: 12px; color: #9aa4af; }
    .body { padding: 32px 28px; }
    .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: #34d399;
      border: 1px solid rgba(52,211,153,0.3); background: rgba(52,211,153,0.08); padding: 4px 10px; border-radius: 999px; margin-bottom: 18px; }
    .badge i { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; display: inline-block; }
    #message { font-size: clamp(22px, 5vw, 34px); font-weight: 800; line-height: 1.4; letter-spacing: -0.01em;
      white-space: pre-wrap; word-break: break-word; font-family: 'Space Grotesk', 'Noto Sans Myanmar', 'Myanmar Sangam MN', 'Myanmar MN', 'Padauk', system-ui, sans-serif; }
    /* The message and name are typed by whoever deployed, so the page labels
       them as such - no "by" value can pass for a notice from the site. */
    .note { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: #9aa4af; margin-bottom: 10px; }
    .meta { margin-top: 20px; font-size: 13px; color: #9aa4af; }
    .meta b { color: #cbd5e1; font-weight: 600; }
    .foot { padding: 14px 16px; border-top: 1px solid rgba(148,163,184,0.16); font-size: 12px; color: #6b7280; text-align: center; }
    .foot a { color: #34d399; text-decoration: none; }
    #mode-badge { border-color: rgba(234,179,8,0.3); background: rgba(234,179,8,0.08); color: #fbbf24; display: none; }
    #mode-badge i { background: #f59e0b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bar">
      <span class="dot dot--close"></span>
      <span class="dot dot--min"></span>
      <span class="dot dot--max"></span>
      <span>hosted on GitHub Pages</span>
    </div>
    <div class="body">
      <div class="badge"><i></i> deployed & live</div>
      <div class="badge" id="mode-badge" hidden><i></i> preview mode — not deployed</div>
      <div class="note">visitor-submitted message · not an official notice</div>
      <div id="message">Loading…</div>
      <div class="meta">shipped by <b id="by">—</b> · <span id="at">—</span></div>
    </div>
    <div class="foot">deployed from <a href="https://thiha.cloud" target="_blank" rel="noopener">thiha.cloud</a></div>
  </div>

  <!-- Embedded manifest (injected at build time) — no extra fetch, bypasses edge cache -->
  <script nonce="CSP_NONCE_PLACEHOLDER">
    // Injected at build time by GitHub Actions
    window.__DEPLOY_MANIFEST__ = JSON.parse('MANIFEST_JSON_PLACEHOLDER');
  </script>

  <script nonce="CSP_NONCE_PLACEHOLDER">
    // Renders strictly as text — never innerHTML — so nothing typed can inject markup.
    const MAX = 280
    const clamp = s => String(s == null ? '' : s).slice(0, MAX)
    function paint(data) {
      document.getElementById('message').textContent = clamp(data.message) || 'Nothing deployed yet.'
      document.getElementById('by').textContent = clamp(data.by) || 'anonymous'
      let at = data.at
      try { at = at ? new Date(Number.isNaN(+at) ? at : +at).toLocaleString() : 'just now' } catch (_) { at = 'just now' }
      document.getElementById('at').textContent = at
    }

    const p = new URLSearchParams(location.search)
    const previewMsg = p.get('msg')
    const previewBy = p.get('by')
    const previewAt = p.get('at')
    const modeBadge = document.getElementById('mode-badge')
    const liveBadge = document.querySelector('.badge:not(#mode-badge)')

    if (previewMsg) {
      // Preview: content from the URL (client-side only, nothing deployed).
      // `hidden` is a property, not a style attribute, so it survives the
      // CSP style-src policy; .badge already carries its own display rule.
      modeBadge.hidden = false
      if (liveBadge) liveBadge.hidden = true
      paint({ message: previewMsg, by: previewBy, at: previewAt || Date.now() })
    } else {
      // Live: use embedded manifest — no extra fetch, bypasses edge cache entirely
      // GitHub Pages caches by PATH and ignores the query string - verified:
      // `?t=<random>` still returns `x-cache: HIT`. So the ?t= below busts the
      // browser cache only, and the edge can serve either file up to 10 minutes
      // stale (cache-control: max-age=600). A brand new path is the only
      // guaranteed miss, which is what data-<ts>.json is for - but a cached
      // index.html names a file the current deploy has already deleted, and
      // that 404 is what produced "Nothing deployed yet." after a good deploy.
      //
      // So read both and keep whichever is genuinely newer. data.json is a
      // stable path that always exists; the timestamped file is fresher when
      // this index.html is current. A stale page then shows the previous
      // message rather than claiming nothing was ever deployed.
      const get = url => fetch(url + '?t=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error('no data')))

      const latestFile = window.__DEPLOY_MANIFEST__?.latest
      const sources = [get('./data.json')]
      if (latestFile)
        sources.push(get('./' + latestFile))

      Promise.allSettled(sources)
        .then((results) => {
          const found = results
            .filter(r => r.status === 'fulfilled' && r.value)
            .map(r => r.value)
          if (!found.length)
            throw new Error('no data')
          found.sort((a, b) => new Date(b.at || 0) - new Date(a.at || 0))
          return found[0]
        })
        .then(paint)
        .catch(() => paint({ message: 'Nothing deployed yet.', by: 'thiha', at: Date.now() }))
    }
  </script>
</body>
</html>
